name: Update data

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch public data and rebuild macro results
        run: python scripts/fetch_macro.py --out data

      - name: Fetch stock and ETF prices
        continue-on-error: true
        run: python scripts/fetch_equities.py --out data

      - name: Fetch FDIC bank call-report data
        continue-on-error: true
        run: python scripts/fetch_banks.py --out data

      - name: Back-test the bank warning screens against FDIC failures
        continue-on-error: true
        run: python scripts/fetch_backtest.py --out data

      - name: Run the SQL analysis
        continue-on-error: true
        run: python scripts/run_sql.py --data data --sql sql/bank_analysis.sql

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update macro data and results"
            git push
          fi
